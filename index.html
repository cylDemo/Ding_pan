<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄金盯盘 · 实时行情</title>
<style>
  :root{
    --blue:#3B82F6; --up:#E5342B; --down:#1A9E5C; --flat:#8A8F98;
    --line:#EDEEF0; --line2:#F5F6F7; --ink:#111418; --ink2:#5B6169; --ink3:#9AA0A8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#fff;color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px 64px}

  /* 顶栏 */
  header{
    position:sticky;top:0;z-index:10;background:#fff;
    border-bottom:1px solid var(--line);
  }
  .hd{max-width:1080px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:12px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
  .dot.live{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  h1{font-size:15px;font-weight:600;letter-spacing:.2px}
  .hd-meta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--ink3)}
  .btn{
    border:1px solid var(--line);background:#fff;color:var(--ink2);
    font-size:12px;padding:5px 11px;border-radius:4px;cursor:pointer;font-family:inherit;
  }
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn:disabled{opacity:.45;cursor:default}

  /* 主价格 */
  .hero{padding:28px 0 22px;border-bottom:1px solid var(--line2)}
  .hero-label{font-size:12px;color:var(--ink3);letter-spacing:.3px}
  .hero-row{display:flex;align-items:baseline;gap:14px;margin-top:6px;flex-wrap:wrap}
  .hero-price{font-size:44px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .hero-unit{font-size:14px;color:var(--ink3);font-weight:400}
  .chg{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .hero-sub{margin-top:10px;font-size:12px;color:var(--ink3);display:flex;gap:18px;flex-wrap:wrap}
  .hero-sub b{font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}

  /* 区块 */
  section{padding-top:26px}
  .sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .sec-hd h2{font-size:13px;font-weight:600;color:var(--ink)}
  .sec-hd span{font-size:11px;color:var(--ink3);border:1px solid var(--line);padding:1px 6px;border-radius:3px}

  /* 行情网格 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:10px}
  .card{border:1px solid var(--line);border-radius:5px;padding:13px 14px;background:#fff}
  .card .name{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
  .card .name i{font-style:normal;color:var(--ink3);font-size:11px}
  .card .p{font-size:23px;font-weight:600;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .card .c{font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
  .bar{margin-top:10px;height:3px;background:var(--line2);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);opacity:.75}
  .range{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:5px;font-variant-numeric:tabular-nums}

  /* 走势 */
  .trend{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .trend div{background:#fff;padding:12px 14px}
  .trend dt{font-size:11px;color:var(--ink3)}
  .trend dd{font-size:17px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}

  /* 资讯 */
  .news{border-top:1px solid var(--line2)}
  .item{padding:14px 0;border-bottom:1px solid var(--line2);display:flex;gap:14px}
  .item time{font-size:11px;color:var(--ink3);flex:none;width:74px;padding-top:2px;font-variant-numeric:tabular-nums}
  .item .body{min-width:0;flex:1}
  .item h3{font-size:13.5px;font-weight:500;line-height:1.45}
  .item h3 a{color:var(--ink);text-decoration:none}
  .item h3 a:hover{color:var(--blue)}
  .item p{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  .empty{padding:36px 0;text-align:center;color:var(--ink3);font-size:13px}
  .err{margin-top:16px;border:1px solid #F3D6D4;background:#FDF6F5;color:#A6433C;
    padding:11px 14px;border-radius:5px;font-size:12.5px}
  footer{margin-top:26px;font-size:11.5px;color:var(--ink3);line-height:1.7}
  footer a{color:var(--blue);text-decoration:none}
  @media(max-width:600px){
    .hero-price{font-size:36px}
    .item{flex-direction:column;gap:4px}
    .item time{width:auto}
  }
</style>
</head>
<body>

<header>
  <div class="hd">
    <span class="dot live" id="dot"></span>
    <h1>黄金盯盘</h1>
    <div class="hd-meta">
      <span id="updated">加载中…</span>
      <button class="btn" id="refresh">刷新</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="err"></div>
  <div id="content"><div class="empty">正在获取实时行情…</div></div>
  <footer>
    数据来源：京东金融公开行情接口 · 无需登录 · 每 45 秒自动刷新<br>
    💡 本信息由 <a href="https://u3.jr.jd.com/downloadApp/download2v.html?id=16276&activityId=13897" target="_blank">京东金融</a> 提供 · 仅供参考，不构成投资建议
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const fmt = (n, d = 2) => n == null ? '—' : Number(n).toFixed(d);
const cls = r => r.up ? 'up' : (r.down ? 'down' : 'flat');
const sign = n => n == null ? '' : (n > 0 ? '+' : '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function chgText(r){
  if (r.pct == null) return '—';
  return `${sign(r.change)}${fmt(r.change)}  ${sign(r.pct)}${fmt(r.pct)}%`;
}

function cardHtml(r, unit){
  if (!r) return '';
  const lo = r.low, hi = r.high, p = r.price;
  const pos = (lo != null && hi != null && p != null && hi > lo)
    ? Math.min(100, Math.max(0, (p - lo) / (hi - lo) * 100)) : 50;
  return `<div class="card">
    <div class="name"><span>${esc(r.name)}</span><i>${esc(unit || '')}</i></div>
    <div class="p ${cls(r)}">${fmt(r.price)}</div>
    <div class="c ${cls(r)}">${chgText(r)}</div>
    <div class="bar"><i style="width:${pos}%"></i></div>
    <div class="range"><span>低 ${fmt(r.low)}</span><span>高 ${fmt(r.high)}</span></div>
  </div>`;
}

function render(d){
  if (!d) return;
  const m = d.main;
  let h = '';

  if (m){
    h += `<div class="hero">
      <div class="hero-label">${esc(m.name)}</div>
      <div class="hero-row">
        <span class="hero-price ${cls(m)}">${fmt(m.price)}</span>
        <span class="hero-unit">元/克</span>
        <span class="chg ${cls(m)}">${sign(m.change)}${fmt(m.change)} (${sign(m.pct)}${fmt(m.pct)}%)</span>
      </div>
      <div class="hero-sub">
        <span>今开 <b>${fmt(m.open)}</b></span>
        <span>昨收 <b>${fmt(m.prev_close)}</b></span>
        <span>最高 <b>${fmt(m.high)}</b></span>
        <span>最低 <b>${fmt(m.low)}</b></span>
      </div>
    </div>`;
  }

  if (d.spot && d.spot.rows.length){
    h += `<section><div class="sec-hd"><h2>${esc(d.spot.title)}</h2><span>公开行情</span></div>
      <div class="grid">${d.spot.rows.map(r => cardHtml(r, '元/克')).join('')}</div></section>`;
  }

  if (d.accum && d.accum.rows.length){
    h += `<section><div class="sec-hd"><h2>${esc(d.accum.title)}</h2><span>银行积存金</span></div>
      <div class="grid">${d.accum.rows.map(r => cardHtml(r, '元/克')).join('')}</div></section>`;
  }

  const t = d.trend;
  if (t && t.end != null){
    h += `<section><div class="sec-hd"><h2>黄金9999 近 10 日走势</h2><span>${esc(t.range || '')} ${esc(t.verdict || '')}</span></div>
      <dl class="trend">
        <div><dt>收盘价</dt><dd>${fmt(t.end)}</dd></div>
        <div><dt>累计涨跌</dt><dd class="${t.chg >= 0 ? 'up' : 'down'}">${sign(t.chg)}${fmt(t.chg)} (${sign(t.chg_pct)}${fmt(t.chg_pct)}%)</dd></div>
        <div><dt>区间最高</dt><dd>${fmt(t.high)}</dd></div>
        <div><dt>区间最低</dt><dd>${fmt(t.low)}</dd></div>
        <div><dt>波动幅度</dt><dd>${fmt(t.amplitude)}</dd></div>
      </dl></section>`;
  }

  if (d.news && d.news.length){
    h += `<section><div class="sec-hd"><h2>黄金资讯</h2><span>实时</span></div><div class="news">
      ${d.news.map(n => `<div class="item">
        <time>${esc((n.time || '').slice(5))}</time>
        <div class="body">
          <h3><a href="${esc(n.url || '#')}" target="_blank" rel="noopener">${esc(n.title || '')}</a></h3>
          ${n.content ? `<p>${esc(n.content)}</p>` : ''}
        </div>
      </div>`).join('')}
    </div></section>`;
  }

  $('content').innerHTML = h || '<div class="empty">暂无数据</div>';
}

async function load(){
  const btn = $('refresh');
  btn.disabled = true; btn.textContent = '刷新中';
  $('dot').classList.remove('live');
  try{
    const res = await fetch('/api/data?t=' + Date.now());
    const j = await res.json();
    $('updated').textContent = j.updated_at ? '更新于 ' + j.updated_at.slice(11) : '未更新';
    $('err').innerHTML = j.error ? `<div class="err">数据获取失败：${j.error}</div>` : '';
    render(j.data);
  }catch(e){
    $('err').innerHTML = `<div class="err">无法连接本地服务，请确认 gold_watch.py 正在运行</div>`;
  }finally{
    btn.disabled = false; btn.textContent = '刷新';
    $('dot').classList.add('live');
  }
}

$('refresh').addEventListener('click', load);
load();
setInterval(load, 45000);
</script>
</body>
</html>
